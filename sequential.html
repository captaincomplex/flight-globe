<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sequential — Flight Globes</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/globe.gl@2.46.1/dist/globe.gl.min.js"></script>
  <script src="common.js"></script>
</head>
<body>
  <div id="globe"></div>
  <div class="transport">
    <input type="range" id="scrubber" min="0" max="0" value="0" />
    <div class="counter" id="when"></div>
    <div class="counter" id="counter">0 / 0</div>
  </div>
  <script>
  (async () => {
    try {
      const [flights, countries] = await Promise.all([FG.loadFlights(), FG.loadCountries()]);
      const N = flights.length;
      const PER_FLIGHT_MS = 100;

      // Home base = most frequent departure airport; its flights get James's
      // yellow->red colouring, everything else the green->cyan pair.
      const depCounts = new Map();
      for (const f of flights) depCounts.set(f.fromCode, (depCounts.get(f.fromCode) || 0) + 1);
      const homeBase = [...depCounts.entries()].sort((a, b) => b[1] - a[1])[0][0];

      // James Harding's sequential trick: every arc is a single dash of length 1
      // with a gap of (N - 1) arc-lengths, staggered by index — so exactly one
      // flight is lit at any moment, and they fire in date order.
      const arcs = flights.map((f, i) => ({
        ...f,
        seq: i,
        colour: homeBase && f.fromCode === homeBase
          ? ['rgba(255, 255, 0, 0.5)', 'rgba(255, 0, 0, 0.5)']
          : ['rgba(0, 255, 0, 0.2)', 'rgba(0, 255, 255, 0.8)'],
        initialGap: i,
      }));

      // Red dot + code at every destination, like James's labelsData
      const dests = new Map();
      for (const f of flights) {
        const key = `${f.endLat},${f.endLng}`;
        if (!dests.has(key)) dests.set(key, { lat: f.endLat, lng: f.endLng, code: f.toCode || '' });
      }

      const globe = Globe()(document.getElementById('globe'))
        .showGraticules(true)
        .hexPolygonsData(countries.features)
        .hexPolygonResolution(3)
        .hexPolygonMargin(0.1)
        .hexPolygonColor(() => 'rgba(255, 255, 255, 0.1)')
        .arcsData(arcs)
        .arcColor('colour')
        .arcAltitudeAutoScale(0.5)
        .arcStroke(0.3)
        .arcDashLength(1)
        .arcDashGap(Math.max(N - 1, 0))
        .arcDashAnimateTime(PER_FLIGHT_MS)
        .arcDashInitialGap('initialGap')
        .arcsTransitionDuration(0)
        .labelsData([...dests.values()])
        .labelLat('lat')
        .labelLng('lng')
        .labelText('code')
        .labelDotRadius(0.2)
        .labelSize(0.3)
        .labelColor(() => '#FF0000')
        .labelsTransitionDuration(0)
        .enablePointerInteraction(false);

      FG.fitToWindow(globe);
      globe.pointOfView({ ...FG.centroid(flights), altitude: 1 });

      const panel = FG.panel();
      FG.toggleButton(panel, 'Rotation', false, on => {
        globe.controls().autoRotate = on;
        globe.controls().autoRotateSpeed = 0.2;
      });

      // Timeline bar: tracks which flight the dash cycle is lighting up, and
      // scrubbing re-phases every arc's initialGap so the cycle restarts from
      // the chosen flight.
      const scrubber = document.getElementById('scrubber');
      const when = document.getElementById('when');
      const counter = document.getElementById('counter');
      scrubber.max = Math.max(0, N - 1);
      let baseIdx = 0, t0 = performance.now(), scrubbing = false;

      function setPhase(idx) {
        baseIdx = idx;
        t0 = performance.now();
        for (const a of arcs) a.initialGap = ((a.seq - idx) % N + N) % N;
        globe.arcsData(arcs);
      }
      scrubber.addEventListener('input', e => { scrubbing = true; setPhase(+e.target.value); scrubbing = false; });

      const fmt = d => d.toLocaleDateString(undefined, { year: 'numeric', month: 'short' });
      (function tick() {
        const idx = (baseIdx + Math.floor((performance.now() - t0) / PER_FLIGHT_MS)) % N;
        if (!scrubbing) {
          scrubber.value = idx;
          when.textContent = fmt(flights[idx].date);
          counter.textContent = `${idx + 1} / ${N}`;
        }
        requestAnimationFrame(tick);
      })();
    } catch (err) { FG.showError(err); }
  })();
  </script>
</body>
</html>
