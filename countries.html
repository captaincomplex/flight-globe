<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countries — Flight Globes</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/globe.gl@2.46.1/dist/globe.gl.min.js"></script>
  <script src="common.js?v=2"></script>
</head>
<body>
  <div id="globe"></div>
  <script>
  (async () => {
    try {
      const [flights, countries] = await Promise.all([FG.loadFlights(), FG.loadCountries()]);

      // Count flights touching each country (by where their endpoints land),
      // remembering the visited points to prune remote territories below
      const visits = new Map();
      for (const f of flights) {
        const touched = new Map();
        for (const [lat, lng] of [[f.startLat, f.startLng], [f.endLat, f.endLng]]) {
          const c = FG.countryOf(countries, lat, lng);
          if (c) touched.set(c, [lat, lng]);
        }
        for (const [c, pt] of touched) {
          if (!visits.has(c)) visits.set(c, { n: 0, pts: [], hours: 0 });
          const v = visits.get(c);
          v.n++;
          v.pts.push(pt);
          v.hours += FG.flightHours(f);
        }
      }

      // Natural Earth draws overseas territories as part of the parent country
      // (French Guiana is a polygon of France). Keep only the parts of each
      // country's shape within 2,000 km of an airport actually visited there.
      const NEAR_KM = 2000;
      function polygonNear(coords, pts) {
        const ring = coords[0];
        const step = Math.max(1, Math.floor(ring.length / 24));
        for (let i = 0; i < ring.length; i += step) {
          for (const [lat, lng] of pts) {
            if (FG.haversineKm(lat, lng, ring[i][1], ring[i][0]) < NEAR_KM) return true;
          }
        }
        return false;
      }
      function pruneGeometry(feature, pts) {
        const g = feature.geometry;
        if (g.type !== 'MultiPolygon') return feature;
        const kept = g.coordinates.filter(c => polygonNear(c, pts));
        return { ...feature, geometry: { type: 'MultiPolygon', coordinates: kept } };
      }

      const polygons = [...visits.entries()].map(([feature, { n, pts, hours }]) => ({
        ...pruneGeometry(feature, pts),
        altitude: (Math.log(n) + 0.1) / 15,
        capColour: `rgba(${Math.round(Math.log10(n) / 3 * 255)}, 0, ${255 - Math.round(Math.log10(n) / 3 * 255)}, 0.8)`,
        label: `<div style="background:rgba(0,0,0,.8);padding:8px;border-radius:8px">
                  <b>${feature.properties.NAME_CIAWF || feature.properties.ADMIN}</b><br/>
                  Flights: <b>${n}</b><br/>
                  Average Flight Time: <b>${(hours / n).toFixed(1)} hours</b><br/>
                  Total Time: <b>${Math.round(hours)} hours</b>
                </div>`,
      }));

      const globe = Globe()(document.getElementById('globe'))
        .globeImageUrl('assets/earth-night-hd.jpg')
        .backgroundImageUrl('assets/night-sky.png')
        .polygonsData(polygons)
        .polygonAltitude('altitude')
        .polygonCapColor('capColour')
        .polygonSideColor(() => 'rgba(255, 255, 255, 0.05)')
        .polygonLabel('label');

      FG.fitToWindow(globe);
      globe.pointOfView({ ...FG.centroid(flights), altitude: 2 });

      const panel = FG.panel();
      globe.controls().autoRotate = true;
      globe.controls().autoRotateSpeed = 0.2;
      FG.toggleButton(panel, 'Rotation', true, on => { globe.controls().autoRotate = on; });
    } catch (err) { FG.showError(err); }
  })();
  </script>
</body>
</html>
